[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-calf"
version = "0.1.1"
description = "A lightweight real-time terminal monitor for FastAPI servers"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "rich",
    "psutil",
]

[project.scripts]
calf = "fastapi_calf.daemon:main"

[tool.setuptools.packages.find]
include = ["fastapi_calf*"]
